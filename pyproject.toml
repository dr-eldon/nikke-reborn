[project]
name = "nikke-reborn"
version = "0.1.0"
description = "Pack-opening simulation, sprite sheets and the game bundle for NIKKE REBORN"
readme = "README.md"
authors = [
    { name = "Dr. Eldon Tyrell", email = "the.replicant.maker@pm.me" }
]
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "unitypy>=1.25.3",
]

[project.scripts]
bundle = "nikke_reborn.bundle:run"
publish = "nikke_reborn.publish:run"
simulate = "nikke_reborn.simulation:run"
spritesheet = "nikke_reborn.spritesheet:run"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[package]
name = "asset-viewer"
version = "0.1.0"
edition = "2024"
description = "Unity mesh + material viewer (wgpu + iced)"

[dependencies]
bytemuck = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.17"
thiserror = "2"
tracing-subscriber = "0.3"
wgpu = "30"

[dependencies.iced]
git = "https://github.com/iced-rs/iced"
rev = "ab336f6d6403d7206d82c7c2caa46143efde8284"
features = ["tokio", "image-without-codecs"]

[dependencies.tokio]
version = "1"
features = ["fs", "macros", "rt"]

[package]
name = "nikke-reborn"
version = "0.4.0-dev"
edition = "2024"
description = "A GODDESS OF VICTORY: NIKKE content pack for TCG Card Shop Simulator"
publish = false

[dependencies]
regex = "1"
thiserror = "2"
toml = "1"

serde.version = "1"
serde.features = ["derive"]

serde_json.version = "1"
serde_json.features = ["preserve_order"]

tokio.version = "1"
tokio.features = ["fs", "process", "macros", "rt", "io-util"]

[workspace]
members = ["unity-viewer"]
